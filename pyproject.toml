[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-scanner"
version = "1.0.0"
description = "Concurrent TCP port scanner for authorized testing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
port-scanner = "main:main"

[tool.setuptools]
py-modules = ["main", "banner", "config", "port_list", "reporter", "risk", "scanner", "services", "target", "utils"]
